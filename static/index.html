<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CXSHOP · 网课代刷</title>
<style>
:root{--bg:#0b0f1a;--card:#131a2b;--card2:#1a2340;--txt:#e8ecf5;--dim:#8b93ab;--acc:#7c5cff;--acc2:#00d4a6;--err:#ff5c7a;--r:14px}
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
body{background:radial-gradient(1200px 600px at 80% -10%,#2b2160 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0a3a34 0%,transparent 55%),var(--bg);color:var(--txt);min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.logo{font-size:22px;font-weight:800;letter-spacing:.5px}.logo b{color:var(--acc)}
.logo small{display:block;font-size:11px;color:var(--dim);font-weight:400;letter-spacing:2px}
.pill{background:var(--card);border:1px solid #ffffff14;border-radius:999px;padding:8px 16px;font-size:13px;color:var(--dim)}
.pill b{color:var(--acc2)}
.hero{padding:34px 0 26px}.hero h1{font-size:30px;line-height:1.3}.hero p{color:var(--dim);margin-top:8px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:18px}
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid #ffffff12;border-radius:var(--r);padding:20px;transition:.2s;cursor:pointer;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);border-color:#7c5cff66;box-shadow:0 12px 40px #7c5cff22}
.card h3{font-size:16px;margin-bottom:8px}
.card p{color:var(--dim);font-size:12px;line-height:1.6;min-height:38px}
.price{margin-top:14px;font-size:22px;font-weight:800;color:var(--acc2)}
.price small{font-size:12px;color:var(--dim);font-weight:400}
.btn{display:inline-block;background:linear-gradient(90deg,var(--acc),#5b8cff);border:none;color:#fff;padding:10px 22px;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(1.15)}.btn.ghost{background:transparent;border:1px solid #ffffff33;color:var(--txt)}
.btn.block{width:100%;text-align:center;margin-top:14px}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #ffffff10}
th{color:var(--dim);font-weight:500;font-size:12px}
.st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.st.queued{background:#ffb02022;color:#ffb020}.st.running{background:#5b8cff22;color:#7aa2ff}
.st.done{background:#00d4a622;color:var(--acc2)}.st.fail{background:#ff5c7a22;color:var(--err)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
.modal.on{display:flex}
.box{background:var(--card);border:1px solid #ffffff18;border-radius:var(--r);padding:26px;width:100%;max-width:420px}
.box h2{font-size:18px;margin-bottom:16px}
input,textarea{width:100%;background:#0d1322;border:1px solid #ffffff1c;border-radius:10px;color:var(--txt);padding:11px 13px;font-size:14px;margin-bottom:12px;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:90px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px}
.hint{font-size:12px;color:var(--dim);margin-top:-6px;margin-bottom:12px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid #ffffff25;padding:10px 20px;border-radius:10px;display:none;z-index:99}
.toast.on{display:block}
section{display:none}section.on{display:block}
.tabs{display:flex;gap:10px;margin:20px 0 0}
.tab{padding:8px 18px;border-radius:999px;background:var(--card);border:1px solid #ffffff14;cursor:pointer;font-size:13px;color:var(--dim)}
.tab.on{color:#fff;border-color:var(--acc);background:#7c5cff22}
.log{background:#0d1322;border-radius:10px;padding:12px;font-family:ui-monospace,monospace;font-size:11px;white-space:pre-wrap;max-height:280px;overflow:auto;color:#9fb4d8}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><b>CX</b>SHOP<small>CHAOXING AUTOMATION</small></div>
  <div class="pill" id="who">未登录</div>
</header>

<section id="sec-auth" class="on">
  <div class="hero"><h1>网课代刷，真实播放</h1><p>CDP 真实浏览器刷课 · 抗回滚 · 下单即开刷</p></div>
  <div class="box" style="margin:0 auto">
    <h2 id="auth-title">登录</h2>
    <input id="u" placeholder="用户名">
    <input id="p" type="password" placeholder="密码">
    <button class="btn block" onclick="doAuth()">登录</button>
    <button class="btn ghost block" onclick="toggleReg()">没有账号？注册</button>
  </div>
</section>

<section id="sec-store">
  <div class="hero"><h1>选择服务</h1><p>下单后自动开工，订单页实时看进度</p></div>
  <div class="grid" id="prods"></div>
  <div class="tabs">
    <div class="tab on" onclick="show('store')">商城</div>
    <div class="tab" onclick="show('orders')">我的订单</div>
  </div>
</section>

<section id="sec-orders">
  <div class="hero"><h1>我的订单</h1></div>
  <table><thead><tr><th>#</th><th>商品</th><th>金额</th><th>状态</th><th>时间</th><th></th></tr></thead><tbody id="olist"></tbody></table>
  <div class="tabs"><div class="tab" onclick="show('store')">商城</div><div class="tab on">我的订单</div></div>
</section>
</div>

<div class="modal" id="m-order"><div class="box">
  <h2 id="mo-title">下单</h2>
  <input id="o-school" placeholder="学校">
  <input id="o-user" placeholder="学习通账号 / 手机号">
  <input id="o-pass" placeholder="密码（仅用于课程系统登录）">
  <div class="hint">或粘贴 cookies.json（有 cookie 就不用密码）</div>
  <textarea id="o-cookies" placeholder='[{"name":"_uid","value":"..."},...] 可选'></textarea>
  <button class="btn block" onclick="submitOrder()">提交订单</button>
  <button class="btn ghost block" onclick="m('m-order',0)">取消</button>
</div></div>

<div class="modal" id="m-log"><div class="box" style="max-width:560px">
  <h2>订单详情</h2><div class="log" id="olog">加载中…</div>
  <button class="btn ghost block" onclick="m('m-log',0)">关闭</button>
</div></div>

<div class="toast" id="toast"></div>
<script>
let tok=localStorage.cxshop_tok||'',reg=false,curPid=0;
const $=id=>document.getElementById(id);
function toast(t){$('toast').textContent=t;$('toast').className='toast on';setTimeout(()=>$('toast').className='toast',2400)}
function m(id,on){$(id).className='modal'+(on?' on':'')}
async function api(path,opt={}){opt.headers={'Content-Type':'application/json','X-Token':tok};if(opt.body)opt.body=JSON.stringify(opt.body);
  const r=await fetch(path,opt);return r.json()}
function toggleReg(){reg=!reg;$('auth-title').textContent=reg?'注册':'登录';
  document.querySelector('#sec-auth .btn').textContent=reg?'注册':'登录'}
async function doAuth(){
  const r=await api(reg?'/api/register':'/api/login',{method:'POST',body:{username:$('u').value,password:$('p').value}});
  if(!r.ok)return toast(r.msg||'失败');
  tok=r.token;localStorage.cxshop_tok=tok;enter()}
async function enter(){
  const me=await api('/api/me');if(!me.ok)return show('auth');
  $('who').innerHTML=`${me.username} · 余额 <b>¥${me.balance.toFixed(2)}</b>`;
  if(me.role==='admin')$('who').innerHTML+=` · <a href="/admin" style="color:var(--acc)">后台</a>`;
  show('store')}
function show(s){for(const x of['auth','store','orders'])$('sec-'+x).className='';
  $('sec-'+s).className='on';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  if(s==='store')loadProds();if(s==='orders')loadOrders()}
async function loadProds(){const r=await api('/api/products');
  $('prods').innerHTML=r.items.map(p=>`<div class="card" onclick="openOrder(${p.pid},'${p.name}')">
    <h3>${p.name}</h3><p>${p.descr||''}</p><div class="price">¥${p.price}<small>/单</small></div></div>`).join('')}
function openOrder(pid,name){curPid=pid;$('mo-title').textContent='下单 · '+name;m('m-order',1)}
async function submitOrder(){
  const r=await api('/api/order',{method:'POST',body:{pid:curPid,school:$('o-school').value,
    stu_user:$('o-user').value,stu_pass:$('o-pass').value,cookies:$('o-cookies').value}});
  if(!r.ok)return toast(r.msg||'下单失败');
  m('m-order',0);toast('下单成功 #'+(r.oid));show('orders')}
async function loadOrders(){const r=await api('/api/orders');
  $('olist').innerHTML=r.items.map(o=>{const t=new Date(o.created_at*1000).toLocaleString('zh-CN',{hour12:false});
    const c={queued:'queued',running:'running',done:'done',fail:'fail'}[o.status]||'queued';
    return`<tr><td>${o.oid}</td><td>${o.name}</td><td>¥${o.fees}</td>
    <td><span class="st ${c}">${o.status}</span></td><td>${t}</td>
    <td><a href="javascript:viewLog(${o.oid})" style="color:var(--acc)">详情</a></td></tr>`}).join('')}
async function viewLog(oid){m('m-log',1);$('olog').textContent='加载中…';
  const r=await api('/api/order/'+oid);$('olog').textContent=r.item?(r.item.worker_log||'（排队中，暂无日志）'):'订单不存在'}
if(tok)enter();
</script>
</body>
</html>
